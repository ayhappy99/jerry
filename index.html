<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 확대/축소만 막는다. 핀치 줌이 들어가면 릴 크기 계산이 흔들려 크기가 튄다.
     스크롤은 막지 않는다. viewport-fit=cover로 노치 영역까지 쓴다. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>주서니 슬롯머신</title>
<meta name="description" content="가상 코인으로 돌리는 개인용 슬롯머신. 실제 금전 요소는 없습니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/cabinet.css">
<link rel="stylesheet" href="css/ui.css">
</head>
<body>
<div id="sprite" class="sprite" aria-hidden="true"></div>

<!-- 치명적 오류를 사용자에게 알리는 자리. main.js 한 곳에서만 채운다. -->
<div id="fatal" class="fatal" role="alert" hidden></div>

<!-- 첫 방문 온보딩 -->
<main id="screen-onboarding" class="screen screen--onboarding" hidden>
  <section class="onboard">
    <p class="onboard__kicker">주서니 슬롯머신</p>
    <h1 class="onboard__title">자리에 앉기</h1>
    <p class="onboard__desc">닉네임을 정하면 슬롯머신이 열립니다.<br>가상 코인 10,000,000으로 시작합니다.</p>
    <form id="nickname-form" novalidate>
      <div class="field">
        <label class="field__label" for="nickname-input">닉네임</label>
        <input id="nickname-input" class="field__input" type="text" inputmode="text"
               autocomplete="off" spellcheck="false" maxlength="12" placeholder="2~12자"
               aria-describedby="nickname-error">
        <p id="nickname-error" class="field__error" role="alert" hidden></p>
      </div>
      <button class="btn btn--primary btn--wide" type="submit">슬롯머신 열기</button>
    </form>
    <p class="onboard__note">가상 코인만 사용하며 실제 금전 요소는 없습니다.</p>
  </section>
</main>

<!-- 로비: 닉네임 입력 후 게임을 고른다 -->
<main id="screen-lobby" class="screen screen--lobby" hidden>
  <header class="lobby__head">
    <p class="lobby__kicker">주서니 슬롯머신</p>
    <h1 class="lobby__title">게임 선택</h1>
    <p class="lobby__seat" id="lobby-seat"></p>
  </header>

  <section class="lobby__shared">
    <div class="lobby__credit">
      <!-- "N개 게임" 숫자는 GAME_KEYS 길이에서 채운다. 게임이 늘 때 문구를 놓치지 않으려는 것이다 -->
      <span class="meter__label">내 코인 <small id="lobby-credit-note"></small></span>
      <output class="meter__value meter__value--credit" id="lobby-credit">0</output>
    </div>
    <p class="lobby__jplabel">럭키 캐비닛 · 파라오의 문이 같이 쌓는 잭팟</p>
    <div class="jackpots" id="lobby-jackpots"></div>
  </section>

  <div class="lobby__games" id="lobby-games" role="list"></div>

  <footer class="lobby__foot">
    <button class="btn btn--ghost" type="button" data-open="settings">설정</button>
  </footer>
</main>

<!-- 캐비닛 -->
<main id="screen-cabinet" class="screen screen--cabinet" data-game="cabinet" hidden>
  <header class="marquee">
    <div class="marquee__bulbs" aria-hidden="true"></div>
    <div class="marquee__inner">
      <h1 class="marquee__title">주서니<span>슬롯머신</span></h1>
      <p class="marquee__seat" id="seat-label"></p>
    </div>
    <button class="icon-btn marquee__lobby" type="button" id="to-lobby" aria-label="게임 선택으로 돌아가기">
      <span aria-hidden="true">◀</span>
    </button>
    <button class="icon-btn marquee__settings" type="button" data-open="menu" aria-label="메뉴 열기">
      <span aria-hidden="true">☰</span>
    </button>
  </header>

  <section class="jackpot" aria-labelledby="jackpot-label">
    <p class="jackpot__label" id="jackpot-label">계속 쌓이는 잭팟 <small>PROGRESSIVE JACKPOT</small></p>
    <div class="jackpots" id="jackpot-bar"></div>
    <!-- 복주머니 전용. 공유 풀 바와 둘 중 하나만 보인다 -->
    <div class="vessels" id="pouch-jackpot-bar" hidden></div>
  </section>

  <!-- 고(GO) 사다리(화투 전용). 이긴 판마다 한 단 오르고 꽝이면 0으로 돌아간다.
       릴 창 안에 두면 두 줄뿐인 카드를 가려서 창 위에 따로 놓았다. -->
  <section class="gobar" id="go" hidden aria-label="고 단계">
    <p class="gobar__label">고 <small>GO</small></p>
    <div class="gobar__ladder" id="go-ladder"></div>
  </section>

  <section class="cabinet">
    <div class="cabinet__frame">
      <div class="cabinet__window" id="reels-panel" role="group" aria-label="릴">
        <div class="reels" id="reels"></div>
        <svg class="lines" id="lines" aria-hidden="true" preserveAspectRatio="none"></svg>
        <div class="glass" aria-hidden="true"></div>
        <div class="flash" id="flash" aria-hidden="true"></div>
        <div class="freespin-badge" id="freespin-badge" hidden></div>
        <div class="chain-badge" id="chain-badge" hidden></div>
        <!-- 부적 게이지(파라오). 연쇄 한 단계마다 한 칸 차고 스핀을 넘겨 이어진다 -->
        <div class="charge" id="charge" hidden>
          <span class="charge__label">부적</span>
          <span class="charge__pips" id="charge-pips"></span>
        </div>
        <!-- ways 표시(용문). 이번 스핀에 열린 당첨 경로 수다 -->
        <div class="ways" id="ways" hidden>
          <span class="ways__value" id="ways-value">0</span>
          <span class="ways__label">WAYS</span>
        </div>
        <div class="hold-badge" id="hold-badge" hidden></div>
        <!-- 어트랙트 모드: 유휴 상태에서 혼자 돌 때만 보인다 -->
        <div class="attract" id="attract" hidden>
          <p class="attract__line">터치하여 시작</p>
          <p class="attract__sub">가상 코인으로만 돌아갑니다</p>
        </div>
      </div>
    </div>
    <p class="sr-only" id="reel-readout" role="status" aria-live="polite"></p>
  </section>

  <!-- 하단 통합 조작바: 크레딧 · 베팅 · TOTAL WIN · 스핀을 한 줄에 모은다 -->
  <section class="panel">
    <p class="message" id="message"></p>

    <div class="dock">
      <div class="dock__left">
        <div class="meter">
          <span class="meter__label">내 코인 <small>CREDIT</small></span>
          <output class="meter__value meter__value--credit" id="credit-meter">0</output>
        </div>
        <div class="dock__bet">
          <span class="meter__label">한 번에 거는 돈 <small>BET</small></span>
          <!-- 금액은 한 줄을 통째로 쓴다. 버튼 사이에 끼우면 칸이 좁아 잘린다 -->
          <output class="controls__betlabel" id="bet-label">0</output>
          <div class="controls__bet">
            <button class="btn btn--round" type="button" id="bet-down" aria-label="거는 돈 낮추기">−</button>
            <button class="btn btn--round" type="button" id="bet-up" aria-label="거는 돈 올리기">＋</button>
            <button class="btn btn--ghost" type="button" id="bet-max" aria-label="지금 가진 코인으로 한 판 돌릴 수 있는 최대 금액">최대</button>
          </div>
          <p class="dock__betsub" id="bet-sub"></p>
        </div>
      </div>

      <div class="dock__win">
        <span class="dock__winlabel">이번 당첨금 <small>TOTAL WIN</small></span>
        <output class="dock__winvalue" id="win-meter">0</output>
      </div>

      <div class="dock__actions">
        <button class="btn btn--spin" type="button" id="spin" aria-keyshortcuts="Space">SPIN</button>
        <div class="dock__auto">
          <button class="btn btn--auto" type="button" id="auto" aria-haspopup="true" aria-expanded="false">자동</button>
          <div class="autopick" id="auto-pick" role="menu" aria-label="자동 스핀 횟수" hidden></div>
        </div>
      </div>
    </div>
  </section>

  <footer class="toolbar">
    <button class="tool" type="button" data-open="howto"><span aria-hidden="true">?</span><span class="tool__label">게임 방법</span></button>
    <button class="tool" type="button" data-open="paytable"><span aria-hidden="true">▤</span><span class="tool__label">배당표</span></button>
    <button class="tool" type="button" data-open="history"><span aria-hidden="true">★</span><span class="tool__label">기록</span></button>
    <button class="tool" type="button" id="sound-toggle"><span aria-hidden="true">♪</span><span class="tool__label">소리</span></button>
    <button class="tool" type="button" id="refill"><span aria-hidden="true">＋</span><span class="tool__label">충전</span></button>
    <button class="tool" type="button" data-open="settings"><span aria-hidden="true">⚙</span><span class="tool__label">설정</span></button>
  </footer>
</main>

<div id="modal-root"></div>
<div id="overlay-root"></div>
<div id="toast-root" class="toasts" aria-live="polite"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
